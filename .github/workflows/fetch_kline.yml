name: Fetch K-Line CSV

on:
  # 手动触发：配置可输入的参数
  workflow_dispatch:
    inputs:
      tickers:
        description: '标的代码（多个用英文逗号隔开）'
        required: false
        default: 'GC=F,MU,NVDA,SOXQ'
        type: string
      period:
        description: '数据时间跨度'
        required: false
        default: '3mo'
        type: choice
        options:
          - '1mo'
          - '3mo'
          - '6mo'
          - '1y'

  # 定时任务：每周一至周五 UTC 21:30 自动执行（使用默认参数）
  schedule:
    - cron: '30 21 * * 1-5'

jobs:
  run-fetcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 将 GitHub 界面输入的参数传递给 Python 脚本
      - name: Execute Fetch Script
        run: |
          python fetch_data.py \
            --tickers "${{ inputs.tickers }}" \
            --period "${{ inputs.period }}"

      - name: Upload CSV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-kline-data
          path: kline_data/
          retention-days: 7
